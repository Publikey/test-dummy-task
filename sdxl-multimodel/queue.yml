queues:
  sdxl-multimodel:
    sub_queues:
      - name: "normal"
        priority: 4
      - name: "priority"
        priority: 6
    deployment:
      git_url: "https://github.com/Publikey/test-dummy-task.git"
      branch: "master"
      code_path: "sdxl-multimodel"
      startup_cmd: "python model.py"
      mode: "long_running"
      startup_timeout_secs: 600
      redis_storage: true
      vaults:
        - sdxl-multimodel
    input:
      - name: "id"
        type: ["string"]
        required: true
        description: "Request UUID"
      - name: "model_name"
        type: ["string"]
        required: true
      - name: "prompt"
        type: ["string"]
        required: true
      - name: "negative_prompt"
        type: ["string"]
        required: false
      - name: "width"
        type: ["int"]
        required: false
        default: 1024
      - name: "height"
        type: ["int"]
        required: false
        default: 1024
      - name: "num_steps"
        type: ["int"]
        required: false
        default: 28
      - name: "guidance_scale"
        type: ["float", "int"]
        required: false
        default: 6
      - name: "clip_skip"
        type: ["int"]
        required: false
        default: 0
      - name: "scheduler"
        type: ["string"]
        required: false
      - name: "batch_nbr"
        type: ["int"]
        required: false
        default: 1
      - name: "seed"
        type: ["int"]
        required: false
      - name: "img_url"
        type: ["string"]
        required: false
        description: "Source image URL for img2img"
      - name: "img_base64"
        type: ["string"]
        required: false
        description: "Source image as base64 for img2img"
      - name: "strength"
        type: ["float"]
        required: false
        default: 0.75
        description: "img2img strength (0.1-1.0)"
      - name: "webhook_url"
        type: ["string"]
        required: false
        description: "URL to POST results to"
    output:
      - name: "id"
        type: ["string"]
      - name: "data"
        type: ["array"]
        description: "Array with blob_url (or result base64 fallback) and seed"
      - name: "errors"
        type: ["array"]
