queues:
  # Google Veo video generation
  google-video:
    priority: 5
    deployment:
      git_url: "https://github.com/Publikey/test-dummy-task.git"
      branch: "external-api-call"
      code_path: "google_video"
      startup_cmd: "python main.py"
      mode: "long_running"
      env_vars: {}
        # GOOGLE_API_KEY: Set this on the worker machine directly
      startup_timeout_secs: 60
    input:
      - name: "model"
        type:
          - "string"
        required: true
        description: "Model name: veo-3.1-generate-preview, veo-3.1-fast-generate-preview"
      - name: "prompt"
        type:
          - "string"
        required: true
        description: "Video description"
      - name: "negative_prompt"
        type:
          - "string"
        required: false
        description: "What to avoid in the video"
      - name: "aspect_ratio"
        type:
          - "string"
        required: false
        description: "Aspect ratio: 16:9, 9:16"
      - name: "resolution"
        type:
          - "string"
        required: false
        description: "Resolution: 720p, 1080p"
      - name: "duration_seconds"
        type:
          - "int"
        required: false
        description: "Duration in seconds: 4, 6, 8"
      - name: "person_generation"
        type:
          - "string"
        required: false
        description: "Person generation: allow_all, allow_adult"
      - name: "seed"
        type:
          - "int"
        required: false
        description: "Seed for reproducibility"
      - name: "poll_interval"
        type:
          - "int"
        required: false
        description: "Seconds between status checks (default: 10)"
      - name: "max_wait"
        type:
          - "int"
        required: false
        description: "Maximum seconds to wait (default: 600)"
    output:
      - name: "videos"
        type:
          - "array"
        description: "Array of base64-encoded videos"
      - name: "model"
        type:
          - "string"
        description: "Model used"
      - name: "provider"
        type:
          - "string"
        description: "Provider name (google)"
      - name: "mime_type"
        type:
          - "string"
        description: "Video MIME type"
      - name: "operation_name"
        type:
          - "string"
        description: "Long-running operation name"
